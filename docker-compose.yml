version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: multi-domain-nginx
    restart: unless-stopped
    ports:
      - "2222:2222"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./builds:/usr/share/nginx/html/builds
      - ./logs/nginx:/var/log/nginx
    extra_hosts:
      - "city1.localhost:127.0.0.1"
      - "city2.localhost:127.0.0.1"
    depends_on:
      - nuxt
    networks:
      - app-network

  nuxt:
    image: node:22-alpine
    container_name: multi-domain-nuxt
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"  # Nuxt dev server
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=3000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - NPM_CONFIG_REGISTRY=https://registry.npmmirror.com
    command: sh -c "npm install && npm run build && npm run preview"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge