events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    
    sendfile on;
    keepalive_timeout 65;
    
    # Определяем город по хосту
    map $host $city {
        city1.localhost "city1";
        city2.localhost "city2";
        default "city1";
    }

    upstream nuxt_backend {
        server nuxt:3000;
    }
    
    server {
        listen 2222;
        server_name localhost city1.localhost city2.localhost;

        location /en/api/ {
            rewrite ^/en/api/?(.*)$ /api/$1 last;
        }
        
        # API запросы - на ноду
        location /api/ {
            proxy_pass http://nuxt_backend;
            # Все необходимые заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Original-URI $request_uri;
            
            # Для CORS
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            
            # Таймауты
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }
        
        # ========== АНГЛИЙСКАЯ ВЕРСИЯ (/en/) ==========
        location /en/_nuxt/ {
            alias /usr/share/nginx/html/builds/${city}-en/public/_nuxt/;
            try_files $uri =404;
        }
        
        location /en/_i18n/ {
            alias /usr/share/nginx/html/builds/${city}-en/public/_i18n/;
            try_files $uri =404;
        }
        
        location /en/builds/ {
            alias /usr/share/nginx/html/builds/${city}-en/public/builds/;
            try_files $uri =404;
        }
        
        location /en/ {
            alias /usr/share/nginx/html/builds/${city}-en/public/;
            try_files $uri $uri/ /en/index.html;
        }
        
        # ========== РУССКАЯ ВЕРСИЯ (/) ==========
        location /_nuxt/ {
            root /usr/share/nginx/html/builds/${city}-ru/public;
            try_files $uri =404;
        }
        
        location /_i18n/ {
            root /usr/share/nginx/html/builds/${city}-ru/public;
            try_files $uri =404;
        }
        
        location /builds/ {
            root /usr/share/nginx/html/builds/${city}-ru/public;
            try_files $uri =404;
        }
        
        location / {
            root /usr/share/nginx/html/builds/${city}-ru/public;
            try_files $uri $uri/ /index.html;
        }
        
        # Обработка ошибок
        error_page 404 /404.html;
        error_page 500 502 503 504 /500.html;
    }
}